apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-server-config
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
data:
  runtime-identity: homelab-temporal-v1
  immutable-history-shards: "128"
  config_template.yaml: |-
    # enable-template
    log:
      stdout: true
      level: info
      format: json
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 128
      datastores:
        default:
          sql:
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal
            connectAddr: 192.168.1.10:5433
            connectProtocol: tcp
            user: {{ env "TEMPORAL_POSTGRES_USER" | quote }}
            password: {{ env "TEMPORAL_DEFAULT_STORE_PASSWORD" | quote }}
            maxConns: 2
            maxIdleConns: 1
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/temporal/postgres/ca.crt
              certFile: /etc/temporal/postgres/tls.crt
              keyFile: /etc/temporal/postgres/tls.key
              enableHostVerification: true
        visibility:
          sql:
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal_visibility
            connectAddr: 192.168.1.10:5433
            connectProtocol: tcp
            user: {{ env "TEMPORAL_POSTGRES_USER" | quote }}
            password: {{ env "TEMPORAL_VISIBILITY_STORE_PASSWORD" | quote }}
            maxConns: 1
            maxIdleConns: 1
            maxConnLifetime: 1h
            tls:
              enabled: true
              caFile: /etc/temporal/postgres/ca.crt
              certFile: /etc/temporal/postgres/tls.crt
              keyFile: /etc/temporal/postgres/tls.key
              enableHostVerification: true
    global:
      membership:
        name: temporal
        maxJoinDuration: 30s
        broadcastAddress: {{ env "POD_IP" | quote }}
      pprof:
        port: 7936
      metrics:
        tags:
          service: {{ env "TEMPORAL_SERVICES" | quote }}
          cluster: homelab-temporal-v1
        prometheus:
          timerType: histogram
          listenAddress: 0.0.0.0:9090
    services:
      frontend:
        rpc:
          grpcPort: 7233
          httpPort: 7243
          membershipPort: 6933
          bindOnIP: 0.0.0.0
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: 0.0.0.0
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: 0.0.0.0
      worker:
        rpc:
          membershipPort: 6939
          bindOnIP: 0.0.0.0
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "homelab-temporal-v1"
      currentClusterName: "homelab-temporal-v1"
      clusterInformation:
        homelab-temporal-v1:
          enabled: true
          initialFailoverVersion: 1
          rpcName: temporal-frontend
          rpcAddress: temporal-frontend.temporal.svc.cluster.local:7233
    dcRedirectionPolicy:
      policy: noop
      toDC: ""
    archival:
      status: disabled
    publicClient:
      hostPort: temporal-frontend.temporal.svc.cluster.local:7233
    dynamicConfigClient:
      filepath: /etc/temporal/dynamic_config/dynamic_config.yaml
      pollInterval: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
data:
  dynamic_config.yaml: |-
    # Deliberately empty. Add version-controlled overrides only after review.
    {}
