apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema-setup-primary-1-31-2
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: schema-setup
    temporal.io/store: primary
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: schema-setup
        temporal.io/store: primary
      annotations:
        elastic.co/dataset: kubernetes.container_logs.temporal
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: schema-setup
        image: temporalio/admin-tools@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
        imagePullPolicy: IfNotPresent
        command: ["sh", "-ec"]
        args:
        - temporal-sql-tool setup-schema -v 0.0
        env:
        - name: SQL_PLUGIN
          value: postgres12_pgx
        - name: SQL_HOST
          value: 192.168.1.10
        - name: SQL_PORT
          value: "5433"
        - name: SQL_DATABASE
          value: temporal
        - name: SQL_USER
          valueFrom:
            secretKeyRef:
              name: temporal-postgres
              key: username
        - name: SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: temporal-postgres
              key: password
        - name: SQL_TLS
          value: "true"
        - name: SQL_TLS_CA_FILE
          value: /etc/temporal/postgres/ca.crt
        - name: SQL_TLS_CERT_FILE
          value: /etc/temporal/postgres/tls.crt
        - name: SQL_TLS_KEY_FILE
          value: /etc/temporal/postgres/tls.key
        - name: SQL_TLS_DISABLE_HOST_VERIFICATION
          value: "false"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: postgres-tls
          mountPath: /etc/temporal/postgres
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: postgres-tls
        secret:
          secretName: temporal-postgres
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: tmp
        emptyDir: {}
---
