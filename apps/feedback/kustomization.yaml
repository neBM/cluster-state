apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap-default-feedback-admin-config.yaml
- deployment-default-feedback-admin.yaml
- deployment-default-feedback-api.yaml
- ingress-default-feedback-api.yaml
- job-default-feedback-migrations.yaml
- service-default-feedback-admin.yaml
- service-default-feedback-api.yaml

namespace: default
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: feedback-release
  literals:
  - migrationVersion=v3
  - migrationRunSuffix=r1
  - migrationImage=registry.brmartin.co.uk:443/ben/cluster-state/feedback-migrations:v3@sha256:a16474563370cfc6497c277218aa9cb0535000ec8818ca9df83f6841fec25d37
replacements:
- source:
    kind: ConfigMap
    name: feedback-release
    fieldPath: data.migrationVersion
  targets:
  - select:
      kind: Job
      labelSelector: app=feedback-api,component=migrations
    fieldPaths:
    - metadata.name
    options:
      delimiter: '-'
      index: 2
- source:
    kind: ConfigMap
    name: feedback-release
    fieldPath: data.migrationRunSuffix
  targets:
  - select:
      kind: Job
      labelSelector: app=feedback-api,component=migrations
    fieldPaths:
    - metadata.name
    options:
      delimiter: '-'
      index: 3
- source:
    kind: ConfigMap
    name: feedback-release
    fieldPath: data.migrationImage
  targets:
  - select:
      kind: Job
      labelSelector: app=feedback-api,component=migrations
    fieldPaths:
    - spec.template.spec.containers.0.image

images:
- name: postgrest/postgrest
  newTag: v16.6@sha256:5ce030c153500fe90ba157da4da8ba99ab51d3bc7b95e071bd0b544b67a632f7
- name: python
  newTag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
