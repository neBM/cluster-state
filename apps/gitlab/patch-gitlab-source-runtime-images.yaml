# Temporary old-runtime preservation for controlled source capture/resumption.
# Apply from the outer apps layer, after the legacy tag replacements; never pin
# the shared webservice repository globally (the completed Job must not change).
# Pins change Pod templates: hold/ACK the root/apps owners before merge/apply.
# Remove with legacy retirement in Task6; do not pin the native chart's updater.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-kas
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: kas
        image: registry.gitlab.com/gitlab-org/build/cng/gitlab-kas:v19.5.0@sha256:dd8e02add8cf5c1385b8840ace93b5f7c55e5e23f417b0fcdf64306d2cc71601
