      - name: sidekiq
        image: registry.gitlab.com/gitlab-org/build/cng/gitlab-sidekiq-ce:v19.5.5@sha256:aa52502b94c24358f6b0aa88554e390fe5b573d5fcf628afb54a7315413978aa
