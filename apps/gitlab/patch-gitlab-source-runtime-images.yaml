# Immutable serving-runtime pins for the controlled CE 19.5.5 application stage.
# Apply from the outer apps layer, after the appVersion tag replacements. Keep
# these pins aligned with appVersion; do not globally pin the shared webservice
# repository, because migrationVersion independently owns the versioned Job.
# Pins change Pod templates: hold/ACK the root/apps owners before merge/apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-gitaly
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: gitaly
        image: registry.gitlab.com/gitlab-org/build/cng/gitaly:v19.5.5@sha256:55c24ff0d32e2c33ecba63c381577d2639480dacac3a5ac61530a8d841ee8029
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-kas
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: kas
        image: registry.gitlab.com/gitlab-org/build/cng/gitlab-kas:v19.5.5@sha256:73eb87788646d6e53ada6818dc6f82685bc884fb95fd04483ab745a742458631
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-registry
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: registry
        image: registry.gitlab.com/gitlab-org/build/cng/gitlab-container-registry:v19.5.5@sha256:afe47d3f109806b6a375c1a1b6ff337f01c173ee5ffd474dbb862ccdc07fb3af
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-sidekiq
