# Only Rails receives the registry signing key, regardless of container order.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-webservice
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: webservice
        volumeMounts:
        - mountPath: /etc/gitlab/registry
          mountPropagation: None
          name: registry-auth
          readOnly: true
      volumes:
      - name: registry-auth
        secret:
          defaultMode: 420
          optional: false
          secretName: gitlab-registry-auth
