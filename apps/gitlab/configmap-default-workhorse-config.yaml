apiVersion: v1
data:
  workhorse-config.toml.tpl: |
    {% $c := file.Read "/etc/gitlab/objectstore/connection" | data.YAML -%}
    {% test.Assert "provider must be a string" (test.IsKind "string" $c.provider) -%}
    {% test.Assert "aws_access_key_id must be a string" (test.IsKind "string" $c.aws_access_key_id) -%}
    {% test.Assert "aws_secret_access_key must be a string" (test.IsKind "string" $c.aws_secret_access_key) -%}
    # GitLab Workhorse configuration
    [redis]
    URL = "redis://gitlab-redis:6379"

    [[listeners]]
    network = "tcp"
    addr = "0.0.0.0:8181"

    [object_storage]
    {% dict "provider" $c.provider | data.ToTOML %}
    [object_storage.s3]
    {% dict "aws_access_key_id" $c.aws_access_key_id "aws_secret_access_key" $c.aws_secret_access_key | data.ToTOML %}
immutable: false
kind: ConfigMap
metadata:
  labels:
    app: gitlab
  name: workhorse-config
  namespace: default
