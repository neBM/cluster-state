apiVersion: v1
data:
  workhorse-config.toml.erb: '<% c = YAML.safe_load(File.read(''/etc/gitlab/objectstore/connection'')) %>

    # GitLab Workhorse configuration

    [redis]

    URL = "redis://gitlab-redis:6379"


    [[listeners]]

    network = "tcp"

    addr = "0.0.0.0:8181"

    [object_storage]

    provider = <%= c.fetch(''provider'').to_json %>

    [object_storage.s3]

    aws_access_key_id = <%= c.fetch(''aws_access_key_id'').to_json %>

    aws_secret_access_key = <%= c.fetch(''aws_secret_access_key'').to_json %>

    '
immutable: false
kind: ConfigMap
metadata:
  labels:
    app: gitlab
  name: workhorse-config
  namespace: default
