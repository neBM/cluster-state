apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-state
  namespace: default
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path-retain
  volumeMode: Filesystem
