apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: default
  annotations:
    # Temporary ownership-transfer protection; remove only after old owner inventories relinquish this object.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
  - name: api
    port: 8642
    protocol: TCP
    targetPort: 8642
  - name: webhook
    port: 8644
    protocol: TCP
    targetPort: 8644
