apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- deployment-default-hermes-agent.yaml
- persistentvolumeclaim-default-hermes-agent-state.yaml
- service-default-hermes-agent.yaml
configMapGenerator:
- name: hermes-agent-state
  literals:
  - mode=candidate
  options:
    annotations:
      # Temporary ownership-transfer protection; remove only after old owner inventories relinquish this object.
      kustomize.toolkit.fluxcd.io/prune: disabled
    labels:
      app.kubernetes.io/component: state-mode
      app.kubernetes.io/name: hermes-agent
