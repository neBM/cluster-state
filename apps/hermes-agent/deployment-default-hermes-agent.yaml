apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: default
  annotations:
    # Temporary ownership-transfer protection; remove only after old owner inventories relinquish this object.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: hestia
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:v2026.8.16.2@sha256:a39fc11620213e3669a327aff5c6cb1eb2b8a238c6044e33e7ef8885833d89a7
        imagePullPolicy: IfNotPresent
        command:
        - /opt/hermes/docker/entrypoint-dispatch.sh
        - gateway
        - run
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_UID
          value: "10000"
        - name: HERMES_GID
          value: "10000"
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: "8642"
        ports:
        - name: api
          containerPort: 8642
          protocol: TCP
        - name: webhook
          containerPort: 8644
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: webhook
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: webhook
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - KILL
            - SETGID
            - SETUID
        volumeMounts:
        - name: state
          mountPath: /opt/data
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: hermes-agent-state
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
