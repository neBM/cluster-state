apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-helm-recovery-windsor-sync
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    helm.sh/resource-policy: keep
spec:
  storageClassName: gitlab-recovery-nfs-sync
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # NFS capacity request is NOT a filesystem quota or a free-space check.
      storage: 100Gi