apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - ingressroutes.yaml
  - persistentvolumeclaim-default-gitlab-helm-recovery-windsor.yaml
configMapGenerator:
  - name: gitlab-helm-upgrade-admission
    files:
      - upgrade-admission.sh=files/upgrade-admission.sh
generatorOptions:
  disableNameSuffixHash: true
