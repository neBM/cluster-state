apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - ingressroutes.yaml
  - persistentvolumeclaim-default-gitlab-helm-recovery-windsor.yaml
  - cronjob-default-gitlab-helm-nas-export.yaml
configMapGenerator:
  - name: gitlab-helm-upgrade-admission
    files:
      - upgrade-admission.sh=files/upgrade-admission.sh
  - name: gitlab-helm-nas-export
    files:
      - nas-export.py=files/nas-export.py
generatorOptions:
  disableNameSuffixHash: true
