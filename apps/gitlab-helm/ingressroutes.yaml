# Inactive with the entire candidate directory; do not attach alongside legacy routes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-helm
  namespace: default
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`git.brmartin.co.uk`) && PathPrefix(`/-/kubernetes-agent/k8s-proxy`)
      priority: 110
      services:
        - name: gitlab-helm-kas
          port: 8154
    - kind: Rule
      match: Host(`git.brmartin.co.uk`) && PathPrefix(`/-/kubernetes-agent`)
      priority: 100
      services:
        - name: gitlab-helm-kas
          port: 8150
    - kind: Rule
      match: Host(`git.brmartin.co.uk`)
      services:
        - name: gitlab-helm-webservice-default
          port: 8181
  tls:
    secretName: wildcard-brmartin-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-helm-registry
  namespace: default
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`registry.brmartin.co.uk`)
      services:
        - name: gitlab-helm-registry
          port: 5000
  tls:
    secretName: wildcard-brmartin-tls
