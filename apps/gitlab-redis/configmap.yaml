apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-redis-durable-config
  namespace: default
  labels:
    app: gitlab-redis-durable
    role: config
immutable: true
data:
  redis.conf: |
    bind 127.0.0.1
    port 6379
    protected-mode no
    databases 16
    dir /data
    dbfilename dump.rdb
    save ""
    maxmemory 0
    maxmemory-policy noeviction
    appendonly yes
    appendfilename appendonly.aof
    appenddirname appendonlydir
    appendfsync always
    no-appendfsync-on-rewrite no
    aof-use-rdb-preamble yes
    aof-load-truncated no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
