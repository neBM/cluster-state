apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis-durable-private
  namespace: default
  labels:
    app: gitlab-redis-durable
    role: durable
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: gitlab-redis-durable
    role: durable
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
