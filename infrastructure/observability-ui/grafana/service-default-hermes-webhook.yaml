apiVersion: v1
kind: Service
metadata:
  name: hermes-webhook
  namespace: default
  annotations:
    # Temporary ownership-transfer protection; remove only after old owner inventories relinquish this object.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: hermes-webhook
    app.kubernetes.io/component: automation
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8644
    protocol: TCP
    targetPort: 8644
