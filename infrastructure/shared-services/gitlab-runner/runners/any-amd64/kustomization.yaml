apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -amd64
generatorOptions:
  disableNameSuffixHash: true
resources:
- ../any
configMapGenerator:
- name: gitlab-runner-config-template-any
  behavior: merge
  literals:
  - |
    20-runner-header.toml=[[runners]]
      name = "RUNNER_NAME_PLACEHOLDER"
      url = "https://git.brmartin.co.uk"
      token = "RUNNER_TOKEN_PLACEHOLDER"
      executor = "kubernetes"
      limit = 1
      request_concurrency = 4
      builds_dir = "/builds"
  - |
    55-kubernetes-resources.toml=  cpu_request = "250m"
  - |
    80-node-selector.toml=[runners.kubernetes.node_selector]
      "kubernetes.io/arch" = "amd64"
