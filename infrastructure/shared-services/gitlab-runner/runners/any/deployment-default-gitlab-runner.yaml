apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gitlab-runner
  name: gitlab-runner
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gitlab-runner
      managed-by: terraform
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: 'true'
        reloader.stakater.com/rollout-strategy: restart
      labels:
        app: gitlab-runner
        managed-by: terraform
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - run
        - --config
        - /config/config.toml
        image: gitlab/gitlab-runner
        imagePullPolicy: Always
        name: gitlab-runner
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          mountPropagation: None
          name: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      initContainers:
      - args:
        - |
          set -eu
          umask 077
          bucket_info=/cosi/gitlab-runner-cache/BucketInfo
          parse_cosi_field() {
            sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" "$bucket_info"
          }

          cache_bucket=$(parse_cosi_field bucketName)
          cache_endpoint=$(parse_cosi_field endpoint)
          cache_access_key=$(parse_cosi_field accessKeyID)
          cache_secret_key=$(parse_cosi_field accessSecretKey)

          if [ "$cache_bucket" != "gitlab-runner-cache" ] || [ -z "$cache_endpoint" ] || [ -z "$cache_access_key" ] || [ -z "$cache_secret_key" ]; then
            echo "ERROR: COSI BucketInfo is missing required GitLab runner cache S3 fields"
            exit 1
          fi

          cache_endpoint=${cache_endpoint#http://}
          cache_endpoint=${cache_endpoint#https://}
          # Escape TOML basic strings first, then sed replacement metacharacters.
          # Credentials remain in this init container; never enable shell tracing.
          escape_replacement() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g' | sed 's/[\\&|]/\\&/g'
          }
          cache_endpoint=$(escape_replacement "$cache_endpoint")
          cache_bucket=$(escape_replacement "$cache_bucket")
          cache_access_key=$(escape_replacement "$cache_access_key")
          cache_secret_key=$(escape_replacement "$cache_secret_key")

          # Global options occur once; each lane contributes only its runner block.
          cat /template/any/05-concurrent.toml /template/any/10-global.toml > /config/config.toml
          for lane in amd64 any arm64 services; do
            case "$lane" in
              amd64) token=$RUNNER_TOKEN_AMD64 ;;
              any) token=$RUNNER_TOKEN_ANY ;;
              arm64) token=$RUNNER_TOKEN_ARM64 ;;
              services) token=$RUNNER_TOKEN_SERVICES ;;
            esac
            if [ -z "$token" ]; then
              echo "ERROR: missing runner token for $lane"
              exit 1
            fi
            token=$(escape_replacement "$token")
            cat /template/"$lane"/[2-9][0-9]-*.toml > /config/runner.template
            sed \
              -e "s|RUNNER_NAME_PLACEHOLDER|k8s-$lane|g" \
              -e "s|RUNNER_TOKEN_PLACEHOLDER|$token|g" \
              -e "s|S3_SERVER_ADDRESS_PLACEHOLDER|$cache_endpoint|g" \
              -e "s|S3_BUCKET_NAME_PLACEHOLDER|$cache_bucket|g" \
              -e "s|MINIO_ACCESS_KEY_PLACEHOLDER|$cache_access_key|g" \
              -e "s|MINIO_SECRET_KEY_PLACEHOLDER|$cache_secret_key|g" \
              /config/runner.template >> /config/config.toml
          done
          rm /config/runner.template
          cp /system-id/system_id /config/.runner_system_id
          chmod 600 /config/config.toml /config/.runner_system_id
        command:
        - /bin/sh
        - -c
        env:
        - name: RUNNER_TOKEN_AMD64
          valueFrom:
            secretKeyRef:
              key: runner_token_amd64
              name: gitlab-runner-secrets
              optional: false
        - name: RUNNER_TOKEN_ANY
          valueFrom:
            secretKeyRef:
              key: runner_token_any
              name: gitlab-runner-secrets
              optional: false
        - name: RUNNER_TOKEN_ARM64
          valueFrom:
            secretKeyRef:
              key: runner_token_arm64
              name: gitlab-runner-secrets
              optional: false
        - name: RUNNER_TOKEN_SERVICES
          valueFrom:
            secretKeyRef:
              key: runner_token_services
              name: gitlab-runner-secrets
              optional: false
        image: busybox
        imagePullPolicy: IfNotPresent
        name: config-generator
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /template/any
          mountPropagation: None
          name: config-template
          readOnly: true
        - mountPath: /template/amd64
          name: config-template-amd64
          readOnly: true
        - mountPath: /template/arm64
          name: config-template-arm64
          readOnly: true
        - mountPath: /template/services
          name: config-template-services
          readOnly: true
        - mountPath: /config
          mountPropagation: None
          name: config
        - mountPath: /system-id
          mountPropagation: None
          name: system-id
          readOnly: true
        - mountPath: /cosi/gitlab-runner-cache
          name: gitlab-runner-cache-cosi
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: gitlab-runner
      serviceAccountName: gitlab-runner
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: gitlab-runner-config-template
          optional: false
        name: config-template
      - name: config-template-amd64
        configMap:
          name: gitlab-runner-config-template-amd64
          optional: false
      - name: config-template-arm64
        configMap:
          name: gitlab-runner-config-template-arm64
          optional: false
      - name: config-template-services
        configMap:
          name: gitlab-runner-config-template-services
          optional: false
      - configMap:
          defaultMode: 420
          name: gitlab-runner-system-id
          optional: false
        name: system-id
      - name: gitlab-runner-cache-cosi
        secret:
          secretName: gitlab-runner-cache-cosi-s3
      - emptyDir: {}
        name: config
