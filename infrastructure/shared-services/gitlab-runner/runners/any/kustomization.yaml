apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
generatorOptions:
  disableNameSuffixHash: true
nameSuffix: -any
configMapGenerator:
- name: gitlab-runner-config-template
  behavior: merge
  options:
    labels:
      app: gitlab-runner
      arch: any
  # Generic jobs share the one usable ARM slot with native ARM jobs.
  literals:
  - |
    20-runner-header.toml=[[runners]]
      name = "RUNNER_NAME_PLACEHOLDER"
      url = "https://git.brmartin.co.uk"
      token = "RUNNER_TOKEN_PLACEHOLDER"
      executor = "kubernetes"
      limit = 1
      request_concurrency = 4
      builds_dir = "/builds"
  files:
  - fragments/35-env-extra.toml
  - fragments/55-kubernetes-resources.toml
  - fragments/60-pull-policy.toml
  - fragments/65-helper-image.toml
  - fragments/75-kubernetes-services.toml
resources:
- ../../runner-base
