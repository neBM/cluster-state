apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
generatorOptions:
  disableNameSuffixHash: true
nameSuffix: -any
configMapGenerator:
- name: gitlab-runner-config-template
  behavior: merge
  options:
    labels:
      app: gitlab-runner
      arch: any
  files:
  - fragments/35-env-extra.toml
  - fragments/55-kubernetes-resources.toml
  - fragments/60-pull-policy.toml
  - fragments/65-helper-image.toml
  - fragments/75-kubernetes-services.toml
- name: gitlab-runner-system-id
  options:
    labels:
      app: gitlab-runner
      arch: any
  envs:
  - system-id.env
resources:
- ../../runner-base
- deployment-default-gitlab-runner.yaml
patches:
- path: patch-deployment.yaml

images:
- name: "gitlab/gitlab-runner"
  newTag: "v19.4.0"
- name: "busybox"
  newTag: "1.38"
