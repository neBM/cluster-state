  [runners.kubernetes.pod_labels]
    "ci.brmartin.co.uk/job" = "true"

  # Hard anti-affinity: at most one CI job pod per node. CI hostPath churn
  # shares disks with embedded etcd; stacking jobs on one node has caused etcd
  # WAL fsync and Raft heartbeat stalls.
  [runners.kubernetes.affinity]
    [runners.kubernetes.affinity.pod_anti_affinity]
      [[runners.kubernetes.affinity.pod_anti_affinity.required_during_scheduling_ignored_during_execution]]
        topology_key = "kubernetes.io/hostname"
        [runners.kubernetes.affinity.pod_anti_affinity.required_during_scheduling_ignored_during_execution.label_selector]
          match_labels = { "ci.brmartin.co.uk/job" = "true" }
