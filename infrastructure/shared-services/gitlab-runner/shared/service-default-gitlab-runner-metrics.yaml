apiVersion: v1
kind: Service
metadata:
  name: gitlab-runner-metrics
  namespace: default
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics
    prometheus.io/port: '9252'
spec:
  type: ClusterIP
  # Only manager Pods carry this app label; CI job Pods use ci.brmartin.co.uk/job.
  selector:
    app: gitlab-runner
  ports:
  - name: metrics
    port: 9252
    targetPort: metrics
    protocol: TCP