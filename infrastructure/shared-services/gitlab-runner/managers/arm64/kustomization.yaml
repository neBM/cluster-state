apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -arm64
generatorOptions:
  disableNameSuffixHash: true
resources:
- ../base
configMapGenerator:
- name: gitlab-runner-system-id
  behavior: replace
  literals:
  - system_id=r_7kmqZ8Nt3Lv2
patches:
- path: patch-deployment.yaml
