apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: hestia-ci-store-gc
  name: hestia-ci-store-gc
  namespace: ci-maintenance-worker
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: 17 4 * * *
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  suspend: false
  timeZone: Etc/UTC
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hestia-ci-store-gc
            ci.brmartin.co.uk/job: "true"
            ci.brmartin.co.uk/maintenance: "true"
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    ci.brmartin.co.uk/job: "true"
                namespaces: [ci, ci-maintenance-worker]
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: true
          containers:
          - args:
            - |
              set -euo pipefail

              python3 -B /policy/maintenance-admission.py gc-claim

              for storage_driver in overlay vfs; do
                echo "CI store GC driver=${storage_driver}"
                podman_store=(
                  podman
                  --tmpdir=/tmp/libpod
                  --root=/var/lib/ci-containers-nocow/storage
                  --runroot=/run/ci-containers-prune
                  --storage-driver=overlay
                )
                if [[ "$storage_driver" == vfs ]]; then
                  # Keep VFS metadata separate from the persistent overlay libpod DB.
                  podman_store=(
                    podman
                    --tmpdir=/tmp/libpod-vfs
                    --root=/var/lib/ci-containers-nocow/storage
                    --runroot=/run/ci-containers-prune/vfs
                    --storage-driver=vfs
                    --transient-store
                  )
                fi
                "${podman_store[@]}" container prune --force --filter until=168h
                "${podman_store[@]}" ps -a --external --filter until=168h --format json > /tmp/external-containers.json
                python3 - <<'PY' > /tmp/external-container-ids
              import json
              import re
              import time

              with open("/tmp/external-containers.json", "rb") as stream:
                  containers = json.load(stream)
              if type(containers) is not list:
                  raise SystemExit("Podman external-container list has an invalid shape; refusing cleanup")
              cutoff = int(time.time()) - 168 * 60 * 60
              for container in containers:
                  if type(container) is not dict:
                      raise SystemExit("Podman external-container list has an invalid item; refusing cleanup")
                  container_id = container.get("Id")
                  created = container.get("Created")
                  if type(container_id) is not str or re.fullmatch(r"[0-9a-f]{64}", container_id) is None or type(created) is not int:
                      raise SystemExit("Podman external-container identity is invalid; refusing cleanup")
                  if created > cutoff:
                      raise SystemExit("Podman returned a recent external container through the 168h filter; refusing cleanup")
                  print(container_id)
              PY
                mapfile -t stale_external_ids < /tmp/external-container-ids
                if (( ${#stale_external_ids[@]} )); then
                  "${podman_store[@]}" rm --force "${stale_external_ids[@]}"
                fi
                "${podman_store[@]}" image prune --all --force --filter until=168h
              done
            command:
            - /bin/bash
            - -ceu
            - --
            env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TMPDIR
              value: /tmp
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            image: quay.io/podman/stable@sha256:c6c3feef40a5c825a98e62a11c8ed4c36ec603327d56eb629230a671e527c3dd
            imagePullPolicy: IfNotPresent
            name: podman-gc
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: true
              privileged: true
              readOnlyRootFilesystem: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
            volumeMounts:
            - mountPath: /var/lib/ci-containers-nocow/storage
              name: podman-storage
            - mountPath: /run/containers
              name: run
            - mountPath: /run/ci-containers-prune
              name: podman-runroot
            - mountPath: /run/libpod
              name: libpod-tmp
            - mountPath: /run/lock
              name: run-lock
            - mountPath: /tmp
              name: tmp
            - mountPath: /dev/shm
              name: dev-shm
            - mountPath: /policy
              name: policy
              readOnly: true
          enableServiceLinks: true
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/hostname: hestia
          restartPolicy: Never
          serviceAccountName: hestia-ci-store-gc
          volumes:
          - hostPath:
              path: /var/lib/ci-containers-nocow/storage
              type: Directory
            name: podman-storage
          - emptyDir: {}
            name: run
          - emptyDir: {}
            name: podman-runroot
          - emptyDir: {}
            name: libpod-tmp
          - emptyDir: {medium: Memory}
            name: run-lock
          - emptyDir: {}
            name: tmp
          - emptyDir: {medium: Memory, sizeLimit: 64Mi}
            name: dev-shm
          - configMap:
              name: hestia-ci-cache-retention
              defaultMode: 0444
            name: policy
