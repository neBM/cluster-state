apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap-ci-gitlab-runner-docker-daemon.yaml
- configmap-ci-gitlab-runner-registries-conf.yaml
- cronjob-ci-hestia-ci-store-gc.yaml
- cronjob-ci-hestia-ci-cache-retention.yaml
- cronjob-ci-hestia-ci-maintenance-admission.yaml
- cronjob-ci-hestia-ci-maintenance-recovery.yaml
- configmap-ci-hestia-ci-maintenance-state.yaml
- rbac-ci-hestia-ci-maintenance.yaml
- namespace-ci-maintenance.yaml
- namespace-ci-maintenance-worker.yaml
- daemonset-ci-gitlab-runner-host-storage.yaml
- namespace-ci.yaml
- role-ci-gitlab-runner.yaml
- role-ci-hestia-ci-store-gc.yaml
- rolebinding-ci-gitlab-runner.yaml
- rolebinding-ci-hestia-ci-store-gc.yaml
- serviceaccount-ci-gitlab-runner.yaml
- serviceaccount-ci-hestia-ci-store-gc.yaml
configMapGenerator:
- name: hestia-ci-cache-retention
  namespace: ci-maintenance
  files:
  - cache-retention.py
  - maintenance-admission.py
- name: hestia-ci-cache-retention
  namespace: ci-maintenance-worker
  files:
  - cache-retention.py
  - maintenance-admission.py
