apiVersion: v1
data:
  config.alloy: |
    // =========================================================================
    // Pod log collection — tails /var/log/pods on the local node
    // =========================================================================

    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Keep only pods that have log files on disk
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }

      // Extract namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Extract pod label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Extract container label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Node label from env var (set in DaemonSet)
      rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
      }

      // Set job label
      rule {
        target_label = "job"
        replacement  = "kubernetes/pods"
      }

      // Drop high-cardinality metadata
      rule {
        regex  = "__meta_kubernetes_pod_uid|__meta_kubernetes_pod_ip|__meta_kubernetes_host_ip"
        action = "labeldrop"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      // Parse CRI log format (containerd/K3s): timestamp stream flags message
      stage.cri {}

      // Drop kube-probe noise (liveness/readiness probe user-agent)
      stage.drop {
        expression = ".*kube-probe.*"
      }

      // Drop health check log noise
      stage.drop {
        expression = ".*(GET|HEAD) /health.* 200"
      }

        // Add cluster label
        stage.static_labels {
          values = {
            cluster = "k3s-homelab",
          }
        }

      forward_to = [loki.write.loki.receiver]
    }

    // =========================================================================
    // Host log collection — systemd journal
    // =========================================================================

    loki.source.journal "journal" {
      path          = "/var/log/journal"
      relabel_rules = discovery.relabel.journal_labels.rules
      forward_to    = [loki.write.loki.receiver]
      labels = {
        job     = "journal",
        node    = sys.env("NODE_NAME"),
        cluster = "k3s-homelab",
      }
    }

    discovery.relabel "journal_labels" {
      targets = []

      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }

      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
    }

    // =========================================================================
    // Host log collection — syslog and auth.log
    // =========================================================================

    local.file_match "host_logs" {
      path_targets = [
        {
          __path__ = "/var/log/syslog",
          job      = "node/syslog",
          node     = sys.env("NODE_NAME"),
          cluster  = "k3s-homelab",
        },
        {
          __path__ = "/var/log/auth.log",
          job      = "node/auth",
          node     = sys.env("NODE_NAME"),
          cluster  = "k3s-homelab",
        },
      ]
    }

    loki.source.file "host_logs" {
      targets    = local.file_match.host_logs.targets
      forward_to = [loki.write.loki.receiver]
    }

    // =========================================================================
    // Loki write endpoint
    // =========================================================================

    loki.write "loki" {
      endpoint {
        url = "http://loki.default.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // =========================================================================
    // Host process metrics — upstream process_exporter embedded in Alloy
    // =========================================================================

    prometheus.exporter.process "host" {
      procfs_path         = "/host/proc"
      gather_smaps        = false
      track_threads       = false
      track_children      = false
      recheck_on_scrape   = false
      remove_empty_groups = false

      // First match wins; every exported group name is a fixed literal.
      matcher {
        name = "k3s"
        comm = ["k3s", "k3s-server", "k3s-agent"]
      }
      matcher {
        name = "containerd"
        comm = ["containerd"]
      }
      matcher {
        name = "runtime-shim"
        comm = ["containerd-shim"]
      }
      matcher {
        name = "seaweedfs"
        comm = ["weed"]
      }
      matcher {
        name = "victoriametrics"
        comm = ["victoria-metric", "vmagent", "vmalert"]
      }
      matcher {
        name = "alloy"
        comm = ["alloy"]
      }
      matcher {
        name = "loki"
        comm = ["loki"]
      }
      matcher {
        name = "cilium"
        comm = ["cilium-agent", "cilium-operator"]
      }
      matcher {
        name = "traefik"
        comm = ["traefik"]
      }
      // Use comm, not argv layout: Chromium can rewrite its process title.
      matcher {
        name = "browser"
        comm = ["chrome", "chromium", "chromium-browse", "chrome-headless", "chrome_crashpad", "firefox"]
      }
      matcher {
        name = "ffmpeg"
        comm = ["ffmpeg", "ffprobe"]
      }
      // Upstream matches regexes against the joined command line. Only known
      // test-package path segments select this literal; no captures are exported.
      matcher {
        name    = "js-tests"
        comm    = ["node", "nodejs", "MainThread"]
        cmdline = ["(^|/)(@playwright/test|playwright(-core)?|vitest|jest)(/|[[:space:]]|$)"]
      }
      // Includes renamed Node MainThread and test/coordinator titles not above.
      matcher {
        name = "node"
        comm = ["node", "nodejs", "MainThread", "npm", "npx"]
      }
      matcher {
        name = "postgres"
        comm = ["postgres", "postmaster"]
      }
      matcher {
        name = "redis"
        comm = ["redis-server", "valkey-server"]
      }
      matcher {
        name = "gitlab"
        comm = ["ruby", "bundle", "puma", "sidekiq", "gitaly", "gitlab-workhors", "gitlab-runner"]
      }
      matcher {
        name = "python"
        comm = ["python", "python3", "python3.12", "python3.13", "python3.14"]
      }
      // Unrecognized and kernel processes stay visible without dynamic labels.
      matcher {
        name    = "other"
        cmdline = [".*"]
      }
    }

    discovery.relabel "host_processes" {
      targets = prometheus.exporter.process.host.targets
      rule {
        target_label = "job"
        replacement  = "node/processes"
      }
      rule {
        target_label = "instance"
        replacement  = sys.env("NODE_NAME")
      }
      rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-homelab"
      }
    }

    prometheus.scrape "host_processes" {
      targets         = discovery.relabel.host_processes.output
      job_name        = "node/processes"
      scrape_interval = "15s"
      scrape_timeout  = "10s"
      sample_limit    = 2000
      forward_to      = [prometheus.remote_write.victoriametrics.receiver]
    }

    prometheus.remote_write "victoriametrics" {
      endpoint {
        url = "http://victoriametrics.default.svc.cluster.local:8428/api/v1/write"
        queue_config {
          max_shards = 2
        }
      }
      // Component WAL shares existing /var/lib/alloy/data, not log positions.
      // Bound outage retention; this is an age policy, not a disk quota.
      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "1h"
      }
    }
immutable: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: logging
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/name: alloy
  name: alloy-config
  namespace: default
