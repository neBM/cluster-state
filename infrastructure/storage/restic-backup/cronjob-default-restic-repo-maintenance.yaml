apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: restic-backup
    component: repo-maintenance
  name: restic-repo-maintenance
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: restic-backup
        component: repo-maintenance
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 0
      completions: 1
      manualSelector: false
      parallelism: 1
      template:
        metadata:
          labels:
            app: restic-backup
            component: repo-maintenance
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/sh
            - /config/maintenance.sh
            env:
            - name: FORGET_TAG
              value: seaweedfs
            image: restic/restic
            imagePullPolicy: IfNotPresent
            name: restic
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /repo
              name: repo
            - mountPath: /config
              name: scripts
              readOnly: true
            - mountPath: /secrets
              name: secrets
              readOnly: true
          dnsPolicy: ClusterFirst
          enableServiceLinks: true
          nodeSelector:
            kubernetes.io/hostname: hestia
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
          - hostPath:
              path: /mnt/csi/backups/restic
              type: Directory
            name: repo
          - configMap:
              defaultMode: 493
              name: restic-backup-scripts
              optional: false
            name: scripts
          - name: secrets
            secret:
              defaultMode: 256
              items:
              - key: RESTIC_PASSWORD
                path: password
              optional: false
              secretName: restic-backup-secrets
      ttlSecondsAfterFinished: 86400
  schedule: 0 7 * * 0
  successfulJobsHistoryLimit: 3
  suspend: false
  timeZone: Europe/London
