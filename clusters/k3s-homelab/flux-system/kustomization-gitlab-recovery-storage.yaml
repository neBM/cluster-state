apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-recovery-storage
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/storage/gitlab-recovery
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: cluster-state
  timeout: 10m0s
  wait: true
  dependsOn:
    - name: storage-nfs-csi
  postBuild:
    substituteFrom:
      - kind: Secret
        name: gitlab-recovery-nfs-config
        optional: false