# INACTIVE: deliberately absent from this directory's resource list.
# Attach only after foundation, identity normalization and cutover admission.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-helm
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./apps/gitlab-helm
  prune: false
  sourceRef:
    kind: GitRepository
    name: cluster-state
  targetNamespace: default
  timeout: 30m
  wait: true
  dependsOn:
    - name: gitlab-recovery-storage
    - name: storage-classes
    - name: shared-services
