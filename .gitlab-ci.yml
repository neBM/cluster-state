# Use each module's native toolchain directive; never rewrite go.mod in CI.
# Explicitly unset FILER_ADDR: CSI's opt-in live-filer integration must skip.
.module_test:
  extends: .contract_job
  script:
    - cd "drivers/${DRIVER_MODULE}"
    - unset FILER_ADDR
    - go test ./...

test:rpi5-dra-driver:
  extends: .module_test
  variables:
    DRIVER_MODULE: rpi5-dra-driver
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - drivers/rpi5-dra-driver/**/*
        - .gitlab-ci.yml

