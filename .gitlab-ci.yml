publish:hermes-workspace:index:
  stage: publish
  needs:
    - job: package:hermes-workspace:amd64
      artifacts: true
    - job: package:hermes-workspace:arm64
      artifacts: true
    - job: validate:manifests
      artifacts: false
  image: quay.io/buildah/stable@sha256:56e6ebc9bb71c8303b1968fb51304d3512e14a1b8c730bd0b27ebdf772a34ceb
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - |
      set -eu
      manifest="localhost/hermes-workspace-index-${CI_PIPELINE_ID}-${CI_JOB_ID}:${CI_COMMIT_SHA}"
      index_digest_file="${CI_PROJECT_DIR}/.hermes-workspace-index.digest"
      local_index_json="${CI_PROJECT_DIR}/.hermes-workspace-index.local.json"
      published_index_json="${CI_PROJECT_DIR}/.hermes-workspace-index.published.json"
      cleanup() {
        set +e
        buildah manifest rm "${manifest}" >/dev/null
        rm -f "${index_digest_file}" "${local_index_json}" "${published_index_json}"
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM

      amd64_ref="$(cat amd64.ref)"
      arm64_ref="$(cat arm64.ref)"
      test "$(wc -l < amd64.ref)" -eq 0
      test "$(wc -l < arm64.ref)" -eq 0
      amd64_digest="${amd64_ref#*@}"
      arm64_digest="${arm64_ref#*@}"
      test "${amd64_ref}" = "${HERMES_WORKSPACE_IMAGE}@${amd64_digest}"
      test "${arm64_ref}" = "${HERMES_WORKSPACE_IMAGE}@${arm64_digest}"
      test "${amd64_ref}" != "${arm64_ref}"
      printf '%s\n' "${amd64_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf '%s\n' "${arm64_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'

      assert_index() {
        index_json="$1"
        awk \
          -v amd64_digest="${amd64_digest}" \
          -v arm64_digest="${arm64_digest}" \
          '
          function reject() {
            failed = 1
          }

          function reset_descriptor() {
            descriptor_media = ""
            descriptor_digest = ""
            descriptor_architecture = ""
            descriptor_os = ""
            media_count = 0
            digest_count = 0
            platform_count = 0
            architecture_count = 0
            os_count = 0
          }

          function finish_descriptor() {
            if (media_count != 1 ||
                digest_count != 1 ||
                platform_count != 1 ||
                architecture_count != 1 ||
                os_count != 1 ||
                descriptor_media != expected_manifest ||
                descriptor_os != "linux") {
              reject()
              return
            }
            if (descriptor_digest == amd64_digest &&
                descriptor_architecture == "amd64") {
              seen_amd64++
              return
            }
            if (descriptor_digest == arm64_digest &&
                descriptor_architecture == "arm64") {
              seen_arm64++
              return
            }
            reject()
          }

          BEGIN {
            expected_list = "application/vnd.docker.distribution.manifest.list.v2+json"
            expected_manifest = "application/vnd.docker.distribution.manifest.v2+json"
          }

          {
            last_line = $0
          }

          NR == 1 {
            if ($0 != "{") {
              reject()
            }
            next
          }

          $0 ~ /^    "schemaVersion": / {
            schema_count++
            if ($0 != "    \"schemaVersion\": 2,") {
              reject()
            }
            next
          }

          $0 ~ /^    "mediaType": / {
            top_media_count++
            if ($0 != "    \"mediaType\": \"" expected_list "\",") {
              reject()
            }
            next
          }

          $0 == "    \"manifests\": [" {
            if (in_manifests || manifest_array_count != 0) {
              reject()
            }
            manifest_array_count++
            in_manifests = 1
            next
          }

          in_manifests && !in_descriptor && $0 == "        {" {
            descriptor_count++
            in_descriptor = 1
            reset_descriptor()
            next
          }

          in_manifests && in_descriptor && !in_platform && $0 ~ /^        },?$/ {
            finish_descriptor()
            in_descriptor = 0
            next
          }

          in_manifests && in_descriptor && !in_platform &&
          $0 ~ /^            "mediaType": / {
            media_count++
            if ($0 == "            \"mediaType\": \"" expected_manifest "\",") {
              descriptor_media = expected_manifest
            } else {
              reject()
            }
            next
          }

          in_manifests && in_descriptor && !in_platform &&
          $0 == "            \"digest\": \"" amd64_digest "\"," {
            digest_count++
            descriptor_digest = amd64_digest
            next
          }

          in_manifests && in_descriptor && !in_platform &&
          $0 == "            \"digest\": \"" arm64_digest "\"," {
            digest_count++
            descriptor_digest = arm64_digest
            next
          }

          in_manifests && in_descriptor && !in_platform &&
          $0 ~ /^            "digest": / {
            digest_count++
            reject()
            next
          }

          in_manifests && in_descriptor && !in_platform &&
          $0 == "            \"platform\": {" {
            platform_count++
            in_platform = 1
            next
          }

          in_manifests && in_descriptor && in_platform &&
          $0 ~ /^                "architecture": "[^"]+",?$/ {
            architecture_count++
            descriptor_architecture = $0
            sub(/^                "architecture": "/, "", descriptor_architecture)
            sub(/",?$/, "", descriptor_architecture)
            next
          }

          in_manifests && in_descriptor && in_platform &&
          $0 ~ /^                "os": "[^"]+",?$/ {
            os_count++
            descriptor_os = $0
            sub(/^                "os": "/, "", descriptor_os)
            sub(/",?$/, "", descriptor_os)
            next
          }

          in_manifests && in_descriptor && in_platform && $0 ~ /^            },?$/ {
            in_platform = 0
            next
          }

          in_manifests && !in_descriptor && $0 == "    ]" {
            manifests_closed_count++
            in_manifests = 0
            next
          }

          in_manifests && !in_descriptor {
            reject()
          }

          END {
            valid = (last_line == "}" &&
                     !failed &&
                     !in_manifests &&
                     !in_descriptor &&
                     !in_platform &&
                     schema_count == 1 &&
                     top_media_count == 1 &&
                     manifest_array_count == 1 &&
                     manifests_closed_count == 1 &&
                     descriptor_count == 2 &&
                     seen_amd64 == 1 &&
                     seen_arm64 == 1)
            exit !valid
          }
          ' "${index_json}"
      }

      buildah manifest create "${manifest}"
      buildah manifest add "${manifest}" "docker://${amd64_ref}"
      buildah manifest add "${manifest}" "docker://${arm64_ref}"
      buildah manifest inspect "${manifest}" > "${local_index_json}"
      assert_index "${local_index_json}"
      buildah manifest push --all --format v2s2 \
        --digestfile "${index_digest_file}" \
        "${manifest}" \
        "docker://${HERMES_WORKSPACE_IMAGE}:${CI_COMMIT_SHA}"
      index_digest="$(cat "${index_digest_file}")"
      printf '%s\n' "${index_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf '%s' "${HERMES_WORKSPACE_IMAGE}@${index_digest}" > hermes-workspace-image.ref
      test "$(wc -l < hermes-workspace-image.ref)" -eq 0
      test "$(cat hermes-workspace-image.ref)" = "${HERMES_WORKSPACE_IMAGE}@${index_digest}"
      buildah manifest inspect "docker://${HERMES_WORKSPACE_IMAGE}@${index_digest}" > "${published_index_json}"
      assert_index "${published_index_json}"
  artifacts:
    name: hermes-workspace-image-${CI_COMMIT_SHA}
    paths:
      - hermes-workspace-image.ref
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - apps/hermes-workspace/image/**/*
        - scripts/verify_hermes_workspace_image.sh
        - .gitlab-ci.yml

