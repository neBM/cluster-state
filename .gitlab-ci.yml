verify:hermes-workspace:amd64:
  stage: validate
  needs: []
  tags:
    - amd64
  image: quay.io/buildah/stable@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script:
    - mkdir -p ${CI_PROJECT_DIR}/.local/share/containers
    - export XDG_RUNTIME_DIR=${CI_PROJECT_DIR}/.local
  script:
    - |
      set -eu
      test "$(uname -m)" = x86_64
      verify_image="localhost/hermes-workspace-verify-amd64:${CI_COMMIT_SHA}"
      cleanup() {
        set +e
        buildah rm --all >/dev/null
        buildah rmi "${verify_image}" >/dev/null
        buildah rmi --all >/dev/null
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM
      buildah build \
        --format docker \
        --arch amd64 \
        --build-arg "TARGETARCH=amd64" \
        --build-arg "OCI_REVISION=${CI_COMMIT_SHA}" \
        -t "${verify_image}" \
        apps/hermes-workspace/image/
      ./scripts/verify_hermes_workspace_image.sh "${verify_image}" amd64 "${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/hermes-workspace/image/**/*
        - scripts/verify_hermes_workspace_image.sh
        - .gitlab-ci.yml

