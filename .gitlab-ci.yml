publish:hermes-workspace:index:
  stage: publish
  needs:
    - job: gate:release
      artifacts: false
    - job: package:hermes-workspace:amd64
      artifacts: true
    - job: package:hermes-workspace:arm64
      artifacts: true
    - job: validate:manifests
      artifacts: false
    - job: validate:workspace-contracts
      artifacts: false
    - job: validate:application-safety
      artifacts: false
  image: quay.io/buildah/stable@sha256:07e637ad7a1df37f44afea8287935b350224ac193d63e5cc96debb50a366853c
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - |
      set -eu
      manifest="localhost/hermes-workspace-index-${CI_PIPELINE_ID}-${CI_JOB_ID}:${CI_COMMIT_SHA}"
      index_digest_file="${CI_PROJECT_DIR}/.hermes-workspace-index.digest"
      cleanup() {
        set +e
        buildah manifest rm "${manifest}" >/dev/null
        rm -f "${index_digest_file}"
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM

      amd64_ref="$(cat amd64.ref)"
      arm64_ref="$(cat arm64.ref)"
      test "$(wc -l < amd64.ref)" -eq 0
      test "$(wc -l < arm64.ref)" -eq 0
      amd64_digest="${amd64_ref#*@}"
      arm64_digest="${arm64_ref#*@}"
      test "${amd64_ref}" = "${HERMES_WORKSPACE_IMAGE}@${amd64_digest}"
      test "${arm64_ref}" = "${HERMES_WORKSPACE_IMAGE}@${arm64_digest}"
      test "${amd64_ref}" != "${arm64_ref}"
      printf '%s\n' "${amd64_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf '%s\n' "${arm64_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'

      buildah manifest create "${manifest}"
      buildah manifest add "${manifest}" "docker://${amd64_ref}"
      buildah manifest add "${manifest}" "docker://${arm64_ref}"
      buildah manifest push --all --format v2s2 \
        --digestfile "${index_digest_file}" \
        "${manifest}" \
        "docker://${HERMES_WORKSPACE_IMAGE}:${CI_COMMIT_SHA}"
      index_digest="$(cat "${index_digest_file}")"
      printf '%s\n' "${index_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf '%s' "${HERMES_WORKSPACE_IMAGE}@${index_digest}" > hermes-workspace-image.ref
      test "$(wc -l < hermes-workspace-image.ref)" -eq 0
      test "$(cat hermes-workspace-image.ref)" = "${HERMES_WORKSPACE_IMAGE}@${index_digest}"
  artifacts:
    name: hermes-workspace-image-${CI_COMMIT_SHA}
    paths:
      - hermes-workspace-image.ref
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - apps/hermes-workspace/image/**/*
        - scripts/verify_hermes_workspace_image.sh
        - .gitlab-ci.yml

.validate_manifest_rules: &validate_manifest_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: &manifest_changes
      - apps/**/*
      - clusters/**/*
      - infrastructure/**/*
      - drivers/**/*
      - renovate.json
      - scripts/**/*
      - .gitlab-ci.yml
  - if: $CI_COMMIT_BRANCH == "main"
    changes: *manifest_changes

.validate_driver_rules: &validate_driver_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - drivers/**/*
      - .gitlab-ci.yml
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - drivers/**/*
      - .gitlab-ci.yml

.contract_job:
  image: ${ACT_IMAGE}
  stage: validate
  needs: []

# No needs/extends here: the native stage barrier waits for EVERY selected
# compile, candidate-image and validation job. Publishers' explicit DAG needs
# must not let release aliases/version tags bypass focused application tests.
gate:release:
  image: ${ACT_IMAGE}
  stage: release-gate
  script:
    - printf '%s\n' 'All selected validation and candidate jobs succeeded'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: *manifest_changes

# Broad scripts coverage intentionally includes launchers, validators, locks and
# fixtures. Manifest-only edits select consumers below, not every mutation suite.
validate:manifests:
  extends: .contract_job
  needs:
    - job: validate:ci-wiring
      artifacts: false
  script:
    - ./scripts/validate_kustomize.sh
  rules: *validate_manifest_rules

validate:ci-wiring:
  extends: .contract_job
  script:
    - uv --no-config run --script scripts/test_ci_wiring.py
  rules: *validate_manifest_rules

validate:application-safety:
  extends: .contract_job
  script:
    - ./scripts/validate_contracts.sh safety
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &safety_changes
        - apps/**/*
        - infrastructure/**/*
        - clusters/**/*
        - renovate.json
        - scripts/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *safety_changes

validate:gitlab:
  extends: .contract_job
  before_script:
    # Confined native chart bootstrap: never use ambient Helm3 for this suite.
    - |
      set -eu
      case "$(uname -m)" in
        x86_64) helm_arch=amd64 ;;
        aarch64|arm64) helm_arch=arm64 ;;
        *) echo 'Unsupported Helm architecture' >&2; exit 1 ;;
      esac
      helm_tools="$(mktemp -d)"
      trap 'rm -rf "${helm_tools}"' EXIT
      curl -fLsS --retry 3 "https://get.helm.sh/helm-v4.2.4-linux-${helm_arch}.tar.gz" -o "${helm_tools}/helm.tar.gz"
      curl -fLsS --retry 3 "https://get.helm.sh/helm-v4.2.4-linux-${helm_arch}.tar.gz.sha256sum" -o "${helm_tools}/helm.sha256sum"
      (cd "${helm_tools}"; mv helm.tar.gz "helm-v4.2.4-linux-${helm_arch}.tar.gz"; sha256sum -c helm.sha256sum)
      tar -xzf "${helm_tools}/helm-v4.2.4-linux-${helm_arch}.tar.gz" -C "${helm_tools}"
      export HELM="${helm_tools}/linux-${helm_arch}/helm"
      "${HELM}" version --short
  script:
    - ./scripts/validate_contracts.sh gitlab
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &gitlab_changes
        - apps/gitlab/**/*
        - apps/gitlab-helm/**/*
        - apps/gitlab-redis/**/*
        - apps/kustomization.yaml
        - clusters/**/*
        - infrastructure/storage/gitlab-recovery/**/*
        - infrastructure/observability-ui/grafana/**/*
        - scripts/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *gitlab_changes

validate:runner:
  extends: .contract_job
  script:
    - ./scripts/validate_contracts.sh runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/shared-services/**/*
        - infrastructure/observability-ui/grafana/**/*
        - scripts/**/*
        - scripts/validate_hestia_ci_store_gc_alert.py
        - scripts/validate_hestia_ci_store_gc_alert.py.lock
        - scripts/test_validate_hestia_ci_store_gc_alert.py
        - scripts/test_validate_hestia_ci_store_gc_alert.py.lock
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/shared-services/**/*
        - infrastructure/observability-ui/grafana/**/*
        - scripts/**/*
        - scripts/validate_hestia_ci_store_gc_alert.py
        - scripts/validate_hestia_ci_store_gc_alert.py.lock
        - scripts/test_validate_hestia_ci_store_gc_alert.py
        - scripts/test_validate_hestia_ci_store_gc_alert.py.lock
        - .gitlab-ci.yml

