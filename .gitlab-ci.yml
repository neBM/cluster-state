  image: ${ACT_IMAGE}
  stage: validate
  needs: []
  script:
    - |
      unformatted="$(find drivers -name '*.go' -type f -exec gofmt -l {} +)"
      if [ -n "${unformatted}" ]; then
        echo "Unformatted Go files:"
        echo "${unformatted}"
        exit 1
      fi
