stages:
  - compile
  - package
  - validate
  - publish

variables:
  ACT_IMAGE: ${CI_REGISTRY}/ben/act:latest
  RPI5_IMAGE: ${CI_REGISTRY_IMAGE}/rpi5-dra-driver
  RPI5_IMAGE_CACHE: ${CI_REGISTRY_IMAGE}/rpi5-dra-driver/cache
  SEAWEEDFS_COSI_IMAGE: ${CI_REGISTRY_IMAGE}/seaweedfs-cosi-driver
  SEAWEEDFS_COSI_IMAGE_CACHE: ${CI_REGISTRY_IMAGE}/seaweedfs-cosi-driver/cache
  COSI_SIDECAR_IMAGE: ${CI_REGISTRY_IMAGE}/cosi-provisioner-sidecar
  COSI_SIDECAR_IMAGE_CACHE: ${CI_REGISTRY_IMAGE}/cosi-provisioner-sidecar/cache
  FEEDBACK_MIGRATIONS_IMAGE: ${CI_REGISTRY_IMAGE}/feedback-migrations
  FEEDBACK_MIGRATIONS_IMAGE_CACHE: ${CI_REGISTRY_IMAGE}/feedback-migrations/cache
  FEEDBACK_GOOSE_VERSION: v3.27.1
  HERMES_WORKSPACE_IMAGE: ${CI_REGISTRY_IMAGE}/hermes-workspace
  HERMES_WORKSPACE_IMAGE_CACHE: ${CI_REGISTRY_IMAGE}/hermes-workspace/cache

.buildah_before: &buildah_before
  - mkdir -p ${CI_PROJECT_DIR}/.local/share/containers
  - export XDG_RUNTIME_DIR=${CI_PROJECT_DIR}/.local
  - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.rules_rpi5: &rules_rpi5
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - drivers/rpi5-dra-driver/**/*
      - .gitlab-ci.yml

.rules_seaweedfs_cosi: &rules_seaweedfs_cosi
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - drivers/seaweedfs-cosi-driver/**/*
      - .gitlab-ci.yml

.rules_cosi_sidecar: &rules_cosi_sidecar
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - drivers/cosi-provisioner-sidecar/**/*
      - .gitlab-ci.yml

.rules_feedback_migrations: &rules_feedback_migrations
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - apps/feedback/migrations/**/*
      - apps/feedback/kustomization.yaml
      - .gitlab-ci.yml

compile:rpi5-dra-driver:
  stage: compile
  needs: []
  image:
    name: ${ACT_IMAGE}
    pull_policy: always
  script:
    - cd drivers/rpi5-dra-driver
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/rpi5-dra-driver-amd64 ./cmd/rpi5-dra-driver
    - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/rpi5-dra-driver-arm64 ./cmd/rpi5-dra-driver
  artifacts:
    paths:
      - drivers/rpi5-dra-driver/dist/
    expire_in: 1 hour
  rules:
    - *rules_rpi5

package:rpi5-dra-driver:
  stage: package
  needs:
    - job: compile:rpi5-dra-driver
      artifacts: true
  image: quay.io/buildah/stable:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - for ARCH in amd64 arm64; do
        buildah build
          --arch ${ARCH}
          --build-arg TARGETARCH=${ARCH}
          --layers
          --cache-from ${RPI5_IMAGE_CACHE}-${ARCH}
          --cache-to ${RPI5_IMAGE_CACHE}-${ARCH}
          -t ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}
          drivers/rpi5-dra-driver/
        &&
        buildah push ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH};
      done
    - buildah manifest create ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest add ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64
    - buildah manifest add ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64
    - buildah manifest push --all --format v2s2 ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest push --all --format v2s2 ${RPI5_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${RPI5_IMAGE}:latest
  rules:
    - *rules_rpi5

compile:seaweedfs-cosi-driver:
  stage: compile
  needs: []
  image:
    name: ${ACT_IMAGE}
    pull_policy: always
  script:
    - cd drivers/seaweedfs-cosi-driver
    - go test ./...
    - mkdir -p dist
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/seaweedfs-cosi-driver-amd64 ./cmd/seaweedfs-cosi-driver
    - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/seaweedfs-cosi-driver-arm64 ./cmd/seaweedfs-cosi-driver
  artifacts:
    paths:
      - drivers/seaweedfs-cosi-driver/dist/
    expire_in: 1 hour
  rules:
    - *rules_seaweedfs_cosi

package:seaweedfs-cosi-driver:
  stage: package
  needs:
    - job: compile:seaweedfs-cosi-driver
      artifacts: true
  image: quay.io/buildah/stable:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - for ARCH in amd64 arm64; do
        buildah build
          --arch ${ARCH}
          --build-arg TARGETARCH=${ARCH}
          --layers
          --cache-from ${SEAWEEDFS_COSI_IMAGE_CACHE}-${ARCH}
          --cache-to ${SEAWEEDFS_COSI_IMAGE_CACHE}-${ARCH}
          -t ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}
          drivers/seaweedfs-cosi-driver/
        &&
        buildah push ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH};
      done
    - buildah manifest create ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest add ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64
    - buildah manifest add ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64
    - buildah manifest push --all --format v2s2 ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest push --all --format v2s2 ${SEAWEEDFS_COSI_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${SEAWEEDFS_COSI_IMAGE}:latest
  rules:
    - *rules_seaweedfs_cosi

compile:cosi-provisioner-sidecar:
  stage: compile
  needs: []
  image:
    name: ${ACT_IMAGE}
    pull_policy: always
  script:
    - cd drivers/cosi-provisioner-sidecar
    - go test ./...
    - mkdir -p dist
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/objectstorage-sidecar-amd64 ./cmd/objectstorage-sidecar
    - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/objectstorage-sidecar-arm64 ./cmd/objectstorage-sidecar
  artifacts:
    paths:
      - drivers/cosi-provisioner-sidecar/dist/
    expire_in: 1 hour
  rules:
    - *rules_cosi_sidecar

package:cosi-provisioner-sidecar:
  stage: package
  needs:
    - job: compile:cosi-provisioner-sidecar
      artifacts: true
  image: quay.io/buildah/stable:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - for ARCH in amd64 arm64; do
        buildah build
          --arch ${ARCH}
          --build-arg TARGETARCH=${ARCH}
          --layers
          --cache-from ${COSI_SIDECAR_IMAGE_CACHE}-${ARCH}
          --cache-to ${COSI_SIDECAR_IMAGE_CACHE}-${ARCH}
          -t ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH}
          drivers/cosi-provisioner-sidecar/
        &&
        buildah push ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}-${ARCH};
      done
    - buildah manifest create ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest add ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64
    - buildah manifest add ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64
    - buildah manifest push --all --format v2s2 ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - buildah manifest push --all --format v2s2 ${COSI_SIDECAR_IMAGE}:${CI_COMMIT_SHORT_SHA} docker://${COSI_SIDECAR_IMAGE}:latest
  rules:
    - *rules_cosi_sidecar

compile:feedback-migrations:
  stage: compile
  needs: []
  image:
    name: ${ACT_IMAGE}
    pull_policy: always
  script:
    - cd apps/feedback/migrations
    - mkdir -p dist
    - build_dir="$(mktemp -d)"
    - cd "${build_dir}"
    - go mod init feedback-migrations-build
    - go get github.com/pressly/goose/v3/cmd/goose@${FEEDBACK_GOOSE_VERSION}
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o "${CI_PROJECT_DIR}/apps/feedback/migrations/dist/goose-amd64" github.com/pressly/goose/v3/cmd/goose
    - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o "${CI_PROJECT_DIR}/apps/feedback/migrations/dist/goose-arm64" github.com/pressly/goose/v3/cmd/goose
  artifacts:
    paths:
      - apps/feedback/migrations/dist/
    expire_in: 1 hour
  rules:
    - *rules_feedback_migrations

package:feedback-migrations:
  stage: package
  needs:
    - job: compile:feedback-migrations
      artifacts: true
  image: quay.io/buildah/stable:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - FEEDBACK_MIGRATION_VERSION="$(sed -n 's/^  - migrationVersion=//p' apps/feedback/kustomization.yaml)"
    - test -n "${FEEDBACK_MIGRATION_VERSION}"
    - FEEDBACK_MIGRATION_MANIFEST="feedback-migrations-${FEEDBACK_MIGRATION_VERSION}"
    - for ARCH in amd64 arm64; do
        buildah build
          --arch ${ARCH}
          --build-arg TARGETARCH=${ARCH}
          --layers
          --cache-from ${FEEDBACK_MIGRATIONS_IMAGE_CACHE}-${ARCH}
          --cache-to ${FEEDBACK_MIGRATIONS_IMAGE_CACHE}-${ARCH}
          -t ${FEEDBACK_MIGRATIONS_IMAGE}:${FEEDBACK_MIGRATION_VERSION}-${ARCH}
          apps/feedback/migrations/
        &&
        buildah push ${FEEDBACK_MIGRATIONS_IMAGE}:${FEEDBACK_MIGRATION_VERSION}-${ARCH};
      done
    - buildah manifest rm "${FEEDBACK_MIGRATION_MANIFEST}" || true
    - buildah manifest create "${FEEDBACK_MIGRATION_MANIFEST}"
    - buildah manifest add "${FEEDBACK_MIGRATION_MANIFEST}" docker://${FEEDBACK_MIGRATIONS_IMAGE}:${FEEDBACK_MIGRATION_VERSION}-amd64
    - buildah manifest add "${FEEDBACK_MIGRATION_MANIFEST}" docker://${FEEDBACK_MIGRATIONS_IMAGE}:${FEEDBACK_MIGRATION_VERSION}-arm64
    - buildah manifest push --all --format v2s2 "${FEEDBACK_MIGRATION_MANIFEST}" docker://${FEEDBACK_MIGRATIONS_IMAGE}:${FEEDBACK_MIGRATION_VERSION}
    - buildah manifest push --all --format v2s2 "${FEEDBACK_MIGRATION_MANIFEST}" docker://${FEEDBACK_MIGRATIONS_IMAGE}:latest
  rules:
    - *rules_feedback_migrations

package:hermes-workspace:amd64:
  stage: package
  needs: []
  tags:
    - amd64
  image: quay.io/buildah/stable@sha256:56e6ebc9bb71c8303b1968fb51304d3512e14a1b8c730bd0b27ebdf772a34ceb
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script: *buildah_before
  script:
    - |
      set -eu
      test "$(uname -m)" = x86_64
      package_image="localhost/hermes-workspace-package-amd64:${CI_COMMIT_SHA}"
      digest_file="${CI_PROJECT_DIR}/.amd64.digest"
      cleanup() {
        set +e
        rm -f "${digest_file}"
        buildah rmi "${package_image}" >/dev/null
      }
      trap cleanup EXIT
      trap 'exit 1' HUP INT TERM
      buildah build \
        --format docker \
        --arch amd64 \
        --build-arg "TARGETARCH=amd64" \
        --build-arg "OCI_REVISION=${CI_COMMIT_SHA}" \
        --layers \
        --cache-from "${HERMES_WORKSPACE_IMAGE_CACHE}-amd64" \
        --cache-to "${HERMES_WORKSPACE_IMAGE_CACHE}-amd64" \
        -t "${package_image}" \
        apps/hermes-workspace/image/
      ./scripts/verify_hermes_workspace_image.sh "${package_image}" amd64 "${CI_COMMIT_SHA}"
      buildah push --format v2s2 \
        --digestfile "${digest_file}" \
        "${package_image}" \
        "docker://${HERMES_WORKSPACE_IMAGE}:${CI_COMMIT_SHA}-amd64"
      digest="$(cat "${digest_file}")"
      printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
      printf '%s' "${HERMES_WORKSPACE_IMAGE}@${digest}" > amd64.ref
      test "$(wc -l < amd64.ref)" -eq 0
      test "$(cat amd64.ref)" = "${HERMES_WORKSPACE_IMAGE}@${digest}"
  artifacts:
    name: hermes-workspace-amd64-${CI_COMMIT_SHA}
    paths:
      - amd64.ref
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        - apps/hermes-workspace/image/**/*
        - scripts/verify_hermes_workspace_image.sh
        - .gitlab-ci.yml

