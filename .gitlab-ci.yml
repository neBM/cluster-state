verify:hermes-workspace:amd64:
  stage: validate
  needs: []
  tags:
    - amd64
  image: quay.io/buildah/stable@sha256:56e6ebc9bb71c8303b1968fb51304d3512e14a1b8c730bd0b27ebdf772a34ceb
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
  before_script:
    - mkdir -p ${CI_PROJECT_DIR}/.local/share/containers
    - export XDG_RUNTIME_DIR=${CI_PROJECT_DIR}/.local
  script:
    - |
      set -eu
      test "$(uname -m)" = x86_64
      verify_image="localhost/hermes-workspace-verify-amd64:${CI_COMMIT_SHA}"
      cleanup() {
        set +e
        buildah rm --all >/dev/null
        buildah rmi "${verify_image}" >/dev/null
        buildah rmi --all >/dev/null
