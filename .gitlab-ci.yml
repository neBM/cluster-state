.validate_driver_rules: &validate_driver_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - drivers/**/*
      - .gitlab-ci.yml
  - if: $CI_COMMIT_BRANCH == "main"
    changes:
      - drivers/**/*
      - .gitlab-ci.yml

validate:manifests:
  image: ${ACT_IMAGE}
  stage: validate
  needs: []
  script:
    - ./scripts/test_restic_backup.sh
    - ./scripts/validate_kustomize.sh
  rules: *validate_manifest_rules

validate:driver-sources:
  image: ${ACT_IMAGE}
  stage: validate
  needs: []
  script:
    - |
      unformatted="$(find drivers -name '*.go' -type f -exec gofmt -l {} +)"
      if [ -n "${unformatted}" ]; then
        echo "Unformatted Go files:"
        echo "${unformatted}"
        exit 1
      fi
  rules: *validate_driver_rules
